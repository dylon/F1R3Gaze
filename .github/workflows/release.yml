# Tag vX.Y.Z to publish signed installers for macOS, Windows and Linux.
#
# Secrets (each platform ships unsigned, with a warning, if its are absent):
#   macOS:   MACOS_CERT_P12 (base64 Developer ID Application .p12), MACOS_CERT_PASSWORD,
#            MACOS_SIGN_IDENTITY, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (notarisation)
#   Windows: WINDOWS_CERT_PFX (base64 .pfx), WINDOWS_CERT_PASSWORD
#   Linux:   GPG_PRIVATE_KEY (armoured), GPG_PASSPHRASE — signs SHA256SUMS for every artifact
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no v)"
        required: true
permissions:
  contents: write
defaults:
  run:
    shell: bash
    working-directory: f1r3-work/f1r3gaze
env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version || github.ref_name }}
jobs:
  source_checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: packaging/verify-source.sh

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.95" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: f1r3-work/f1r3gaze }
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libvulkan-dev
      - run: |
          cargo build --locked --release -p gaze-shell -p f1r3c
          bash packaging/verify-system-theme.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries-${{ matrix.arch }}
          path: |
            f1r3-work/f1r3gaze/target/release/f1r3gaze
            f1r3-work/f1r3gaze/target/release/f1r3c
      - name: Package Debian, tarball and AppImage
        run: |
          V="${VERSION#v}"
          packaging/linux/build.sh --format deb --version "$V" --out dist
          packaging/linux/build.sh --format tar --version "$V" --out dist
          packaging/linux/fetch-appimagetool.sh "$RUNNER_TEMP/appimagetool"
          APPIMAGETOOL=packaging/linux/appimagetool-wrapper.sh \
            APPIMAGETOOL_IMAGE="$RUNNER_TEMP/appimagetool/appimagetool-${{ matrix.arch }}.AppImage" \
            APPIMAGETOOL_RUNTIME_FILE="$RUNNER_TEMP/appimagetool/runtime-${{ matrix.arch }}" \
            packaging/linux/build.sh --format appimage --version "$V" --out dist
          dpkg-deb --field "dist/f1r3gaze_${V}_$([[ ${{ matrix.arch }} == x86_64 ]] && echo amd64 || echo arm64).deb"
          bash packaging/linux/ci-portable.sh "$V"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ matrix.arch }}
          path: f1r3-work/f1r3gaze/dist/*

  arch:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, arch: x86_64, image: "archlinux:base-devel" }
          - { runner: ubuntu-22.04-arm, arch: aarch64, image: "menci/archlinuxarm:base-devel" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-binaries-${{ matrix.arch }}
          path: f1r3-work/f1r3gaze/target/release
      - run: chmod +x target/release/f1r3gaze target/release/f1r3c
      - name: Build Arch package, upgrade, launch and remove
        run: |
          docker run --rm --platform "linux/$([[ ${{ matrix.arch }} == x86_64 ]] && echo amd64 || echo arm64)" \
            -v "$GITHUB_WORKSPACE:/src" -w /src/f1r3-work/f1r3gaze ${{ matrix.image }} \
            packaging/linux/ci-arch.sh "${VERSION#v}"
          test -f "dist/f1r3gaze-${VERSION#v}-1-${{ matrix.arch }}.pkg.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: arch-${{ matrix.arch }}
          path: f1r3-work/f1r3gaze/dist/*.pkg.tar.zst

  debian_lifecycle:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, arch: amd64, image: "debian:12" }
          - { runner: ubuntu-22.04-arm, arch: arm64, image: "debian:12" }
          - { runner: ubuntu-22.04, arch: amd64, image: "debian:13" }
          - { runner: ubuntu-22.04-arm, arch: arm64, image: "debian:13" }
          - { runner: ubuntu-22.04, arch: amd64, image: "ubuntu:22.04" }
          - { runner: ubuntu-22.04-arm, arch: arm64, image: "ubuntu:22.04" }
          - { runner: ubuntu-22.04, arch: amd64, image: "ubuntu:24.04" }
          - { runner: ubuntu-22.04-arm, arch: arm64, image: "ubuntu:24.04" }
          - { runner: ubuntu-22.04, arch: amd64, image: "ubuntu:26.04" }
          - { runner: ubuntu-22.04-arm, arch: arm64, image: "ubuntu:26.04" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages-${{ matrix.arch == 'amd64' && 'x86_64' || 'aarch64' }}
          path: f1r3-work/f1r3gaze/dist
      - name: Install older DEB, upgrade, launch and remove on target distro
        run: |
          docker run --rm --platform linux/${{ matrix.arch }} \
            -v "$PWD:/src" -w /src ${{ matrix.image }} \
            bash packaging/linux/ci-deb.sh "${VERSION#v}"

  rpm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, image: "fedora:43", channel: fc43 }
          - { runner: ubuntu-22.04-arm, image: "fedora:43", channel: fc43 }
          - { runner: ubuntu-22.04, image: "fedora:44", channel: fc44 }
          - { runner: ubuntu-22.04-arm, image: "fedora:44", channel: fc44 }
          - { runner: ubuntu-22.04, image: "rockylinux:9", channel: el9 }
          - { runner: ubuntu-22.04-arm, image: "rockylinux:9", channel: el9 }
          - { runner: ubuntu-22.04, image: "rockylinux/rockylinux:10", channel: el10 }
          - { runner: ubuntu-22.04-arm, image: "rockylinux/rockylinux:10", channel: el10 }
          - { runner: ubuntu-22.04, image: "opensuse/leap:16.0", channel: opensuse16 }
          - { runner: ubuntu-22.04-arm, image: "opensuse/leap:16.0", channel: opensuse16 }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - name: Install checkout prerequisites
        working-directory: /
        run: |
          if command -v dnf >/dev/null; then
            dnf -y install git tar gzip
          else
            zypper --non-interactive install git tar gzip
          fi
      - uses: actions/checkout@v4
      - name: Build RPM, upgrade, launch and remove on target distro
        run: packaging/linux/ci-rpm.sh "${VERSION#v}"
      - run: rpm -qip dist/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.channel }}-${{ runner.arch }}
          path: f1r3-work/f1r3gaze/dist/*.rpm

  flatpak:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-binaries-${{ matrix.arch }}
          path: f1r3-work/f1r3gaze/target/release
      - run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
      - name: Build, install, launch and remove Flatpak
        run: bash packaging/flatpak/ci-smoke.sh "${VERSION#v}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flatpak-${{ matrix.arch }}
          path: f1r3-work/f1r3gaze/dist/*.flatpak

  snap:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64, binary_arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: arm64, binary_arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-binaries-${{ matrix.binary_arch }}
          path: f1r3-work/f1r3gaze/target/release
      - name: Stage Snapcraft source
        run: packaging/snap/stage.sh target/release dist/snap-input "${VERSION#v}"
      - uses: snapcore/action-build@v1
        id: snapcraft
        with:
          path: f1r3-work/f1r3gaze/dist/snap-input
      - name: Install, launch and remove snap
        run: bash packaging/snap/ci-smoke.sh '${{ steps.snapcraft.outputs.snap }}' "${VERSION#v}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snap-${{ matrix.arch }}
          path: ${{ steps.snapcraft.outputs.snap }}

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: f1r3-work/f1r3gaze }
      - run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --locked --release --target $t -p gaze-shell -p f1r3c --features gaze-shell/os-keyring
          done
      - name: Test native system theme selection
        env:
          CARGO_BUILD_TARGET: aarch64-apple-darwin
          GAZE_THEME_OS_KEYRING: "1"
        run: bash packaging/verify-system-theme.sh
      - name: Test native macOS URL event validation
        run: |
          cargo test --locked --release --target aarch64-apple-darwin -p gaze-shell --features gaze-shell/os-keyring --lib macos_url::tests::
      - name: Package, sign, notarise
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_INSTALLER_CERT_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
          MACOS_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
          MACOS_INSTALLER_SIGN_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DIST=dist packaging/macos/package.sh "${VERSION#v}" \
            target/aarch64-apple-darwin/release target/x86_64-apple-darwin/release
      - name: Mount DMG, upgrade PKG and deliver URL
        run: bash packaging/macos/ci-smoke.sh "${VERSION#v}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: macos, path: f1r3-work/f1r3gaze/dist/* }

  macos_intel_theme:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: f1r3-work/f1r3gaze }
      - name: Build and launch native Intel binaries
        run: |
          cargo build --locked --release --target x86_64-apple-darwin -p gaze-shell -p f1r3c --features gaze-shell/os-keyring
          test "$(target/x86_64-apple-darwin/release/f1r3gaze --version)" = "f1r3gaze ${VERSION#v}"
      - name: Test native Intel system theme selection
        env:
          CARGO_BUILD_TARGET: x86_64-apple-darwin
          GAZE_THEME_OS_KEYRING: "1"
        run: bash packaging/verify-system-theme.sh
      - name: Test native Intel URL event validation
        run: |
          cargo test --locked --release --target x86_64-apple-darwin -p gaze-shell --features gaze-shell/os-keyring --lib macos_url::tests::

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.95" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: f1r3-work/f1r3gaze }
      - name: Check PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("packaging/windows/package.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) { throw ($errors | Out-String) }
      - run: cargo build --locked --release -p gaze-shell -p f1r3c --features gaze-shell/os-keyring
      - name: Test native system theme selection
        shell: bash
        env:
          GAZE_THEME_OS_KEYRING: "1"
        run: bash packaging/verify-system-theme.sh
      - name: Test Windows URL handoff
        shell: pwsh
        run: |
          cargo test --locked --release -p gaze-shell --features gaze-shell/os-keyring --lib windows_url::tests::
          if ($LASTEXITCODE) { throw 'Windows URL handoff test failed' }
          cargo test --locked --release -p gaze-shell --features gaze-shell/os-keyring --lib external_url::tests::
          if ($LASTEXITCODE) { throw 'External URL validation test failed' }
      - run: python packaging/verify_binary.py target/release/f1r3gaze.exe target/release/f1r3c.exe
      - run: dotnet tool install --global wix --version 4.0.5
      - name: Package and sign
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: .\packaging\windows\package.ps1 -Version ("$env:VERSION" -replace '^v','') -Bin target\release -Dist dist
      - name: Install older MSI, upgrade, deliver URL, remove and check ZIP
        shell: pwsh
        run: .\packaging\windows\ci-smoke.ps1 -Version ("$env:VERSION" -replace '^v','')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows
          path: f1r3-work/f1r3gaze/dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-install-logs
          path: ${{ runner.temp }}/f1r3gaze-msi-*.log

  repository_staging:
    needs: [linux, arch, rpm]
    runs-on: ubuntu-22.04
    container: archlinux:base
    steps:
      - name: Install repository index tools
        working-directory: /
        run: pacman -Syu --noconfirm --needed git python dpkg createrepo_c
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "linux-packages-*", path: f1r3-work/f1r3gaze/dist, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { pattern: "arch-*", path: f1r3-work/f1r3gaze/dist, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { pattern: "rpm-*", path: f1r3-work/f1r3gaze/dist, merge-multiple: true }
      - name: Stage unsigned APT, pacman and RPM repositories
        run: |
          python packaging/repository/stage.py --dist dist --out repository-staging --version "${VERSION#v}" --require-complete
          python packaging/repository/verify-staging.py --tree repository-staging --version "${VERSION#v}"
          tar -czf "repository-staging-${VERSION#v}.tar.gz" repository-staging
      - uses: actions/upload-artifact@v4
        with:
          name: repository-staging
          path: f1r3-work/f1r3gaze/repository-staging-*.tar.gz

  publish:
    needs: [source_checks, linux, debian_lifecycle, arch, rpm, flatpak, snap, repository_staging, macos, macos_intel_theme, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "linux-packages-*", path: f1r3-work/f1r3gaze/dist, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { pattern: "arch-*", path: f1r3-work/f1r3gaze/dist, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { pattern: "rpm-*", path: f1r3-work/f1r3gaze/dist, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { pattern: "flatpak-*", path: f1r3-work/f1r3gaze/dist, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { pattern: "snap-*", path: f1r3-work/f1r3gaze/dist, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: macos, path: f1r3-work/f1r3gaze/dist }
      - uses: actions/download-artifact@v4
        with: { name: windows, path: f1r3-work/f1r3gaze/dist }
      - name: Generate catalog and package-manager manifests
        run: |
          V="${VERSION#v}"
          URL="https://github.com/F1R3FLY-io/F1R3Gaze/releases/download/v$V"
          python3 packaging/release_metadata.py catalog --version "$V" --dist dist --base-url "$URL" --out dist/catalog.json --require-complete
          python3 packaging/release_metadata.py homebrew --version "$V" --dist dist --base-url "$URL" --out metadata/Casks/f1r3gaze.rb
          python3 packaging/release_metadata.py winget --version "$V" --dist dist --base-url "$URL" --out metadata/winget
      - uses: actions/upload-artifact@v4
        with: { name: package-manager-manifests, path: f1r3-work/f1r3gaze/metadata }
      - name: Checksums and signature
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: packaging/sign-checksums.sh dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          draft: true
          files: f1r3-work/f1r3gaze/dist/*
