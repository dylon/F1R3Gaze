[package]
name = "gaze-shell"
description = "F1R3Gaze: a browser whose only execution mechanism is f1r3lang"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "f1r3gaze"
path = "src/main.rs"

[features]
default = ["window"]
# The windowed browser (winit + vello). Without it: headless tools only.
window = ["dep:blitz-shell", "dep:anyrender_vello", "dep:anyrender", "dep:winit"]
os-keyring = ["gaze-shard/os-keyring"]
# Per-frame timings on stdout, for profiling the render loop: Blitz's resolve
# phases, Vello's frame phases, and the window's own line per frame
# (docs/ui/README.md, "Resizing and the render loop"). Off in normal builds.
frame-times = ["window", "blitz-dom/log-phase-times", "anyrender_vello/log_frame_times"]

[dependencies]
blitz-dom = { workspace = true, features = ["svg", "woff", "system-fonts", "file-input"] }
blitz-html.workspace = true
blitz-traits.workspace = true
blitz-shell = { workspace = true, optional = true, features = ["clipboard"] }
anyrender_vello = { workspace = true, optional = true }
anyrender = { workspace = true, optional = true }
winit = { workspace = true, optional = true }
gaze-broker.workspace = true
gaze-dom-blitz.workspace = true
gaze-exec.workspace = true
gaze-dom-core.workspace = true
gaze-knf.workspace = true
gaze-net.workspace = true
gaze-store.workspace = true
gaze-blob.workspace = true
gaze-shard.workspace = true
gaze-wallet.workspace = true
k1ndl1ng-norm.workspace = true
getrandom = "0.2"
url = "2"
keyboard-types = "0.7"
# The cursor shapes Blitz hands its shell (not re-exported by blitz-traits).
cursor-icon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
liblevenshtein = { version = "=4.0.0-rc.4", default-features = false }
parley = { git = "https://github.com/linebender/parley", rev = "332c1c7d9758839577e7979d211d1e3bbf4818af" }
