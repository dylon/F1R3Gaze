<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:676px;height:716px;background:#FFFFFF;" width="676px" height="716px" viewBox="0 0 676 716" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="12"><text x="175.98" y="34.966" fill="#000" font-size="14" textLength="322.041" font-weight="700" font-family="'Noto Sans'">Fitting a search result so that its match shows</text></g><ellipse cx="358.173" cy="65.068" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="172.996" y="95.068" width="370.355" height="69.032" fill="#DDEBF7" style="stroke:#52687A;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="182.996" y="117.896" fill="#182734" font-size="12" textLength="350.355" font-family="'Noto Sans'">mark = match_span(query, label), by the rules of search_score:</text><text x="182.996" y="134.24" fill="#182734" font-size="12" textLength="277.142" font-family="'Noto Sans'">the first case-insensitive occurrence, else the first</text><text x="182.996" y="150.584" fill="#182734" font-size="12" textLength="156.757" font-family="'Noto Sans'">word within the typo bound</text><rect x="233.416" y="184.1" width="249.514" height="36.344" fill="#DDEBF7" style="stroke:#52687A;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="243.416" y="206.928" fill="#182734" font-size="12" textLength="229.514" font-family="'Noto Sans'">kept = the usual cut of the label (end cut)</text><polygon points="292.269,240.444,424.078,240.444,436.078,252.444,424.078,264.444,292.269,264.444,280.269,252.444,292.269,240.444" fill="#DDEBF7" style="stroke:#52687A;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="292.269" y="257.1" fill="#182734" font-size="12" textLength="131.809" font-family="'Noto Sans'">kept shows all of mark?</text><text x="261.633" y="248.928" fill="#000" font-size="12" textLength="18.636" font-family="'Noto Sans'">yes</text><text x="436.078" y="248.928" fill="#000" font-size="12" textLength="14.676" font-family="'Noto Sans'">no</text><rect x="130.937" y="274.444" width="189.345" height="36.344" fill="#E2EFDA" style="stroke:#52687A;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="140.937" y="297.272" fill="#182734" font-size="12" textLength="169.345" font-family="'Noto Sans'">label = kept, mark located in it</text><rect x="340.282" y="274.444" width="300.91" height="69.032" fill="#FFF2CC" style="stroke:#52687A;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="350.282" y="297.272" fill="#182734" font-size="12" textLength="195.613" font-family="'Noto Sans'">label = a window around the mark,</text><text x="350.282" y="313.617" fill="#182734" font-size="12" textLength="51.708" font-family="'Noto Sans'">…context</text><text x="405.11" y="313.617" fill="#182734" font-size="12" textLength="31.692" font-weight="700" font-family="'Noto Sans'">mark</text><text x="439.923" y="313.617" fill="#182734" font-size="12" textLength="191.269" font-family="'Noto Sans'">context…, the context split evenly,</text><text x="350.282" y="329.961" fill="#182734" font-size="12" textLength="207.865" font-family="'Noto Sans'">the left side taking the odd character</text><polygon points="358.173,349.477,370.173,361.477,358.173,373.477,346.173,361.477,358.173,349.477" fill="#DDEBF7" style="stroke:#52687A;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="290.709,393.477,425.638,393.477,437.638,405.477,425.638,417.477,290.709,417.477,278.709,405.477,290.709,393.477" fill="#DDEBF7" style="stroke:#52687A;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="290.709" y="410.133" fill="#182734" font-size="12" textLength="134.929" font-family="'Noto Sans'">the label shows a mark?</text><text x="260.073" y="401.961" fill="#000" font-size="12" textLength="18.636" font-family="'Noto Sans'">yes</text><text x="437.638" y="401.961" fill="#000" font-size="12" textLength="14.676" font-family="'Noto Sans'">no</text><rect x="69.166" y="427.477" width="248.014" height="36.344" fill="#E2EFDA" style="stroke:#52687A;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="79.166" y="450.305" fill="#182734" font-size="12" textLength="228.014" font-family="'Noto Sans'">address = its usual cut (origin + path tail)</text><rect x="16" y="498.821" width="354.346" height="36.344" fill="#E2EFDA" style="stroke:#52687A;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="521.649" fill="#182734" font-size="12" textLength="334.346" font-family="'Noto Sans'">mark the address's own match only where that cut shows it</text><rect x="390.346" y="427.477" width="265.654" height="52.688" fill="#FFF2CC" style="stroke:#52687A;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="400.346" y="450.305" fill="#182734" font-size="12" textLength="245.654" font-family="'Noto Sans'">address = the URL cut if it shows the match,</text><text x="400.346" y="466.649" fill="#182734" font-size="12" textLength="240.146" font-family="'Noto Sans'">else a window around the address's match</text><polygon points="358.173,541.165,370.173,553.165,358.173,565.165,346.173,553.165,358.173,541.165" fill="#DDEBF7" style="stroke:#52687A;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="131.944" y="585.165" width="452.459" height="69.032" fill="#FCE4D6" style="stroke:#52687A;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="141.944" y="607.993" fill="#182734" font-size="12" textLength="432.459" font-family="'Noto Sans'">HTML: escape(before), then the match in a mark element, then escape(after).</text><text x="141.944" y="624.337" fill="#182734" font-size="12" textLength="270.614" font-family="'Noto Sans'">The match is coloured and underlined in accent,</text><text x="141.944" y="640.681" fill="#182734" font-size="12" textLength="256.55" font-family="'Noto Sans'">which changes no width, so the fit stays exact</text><ellipse cx="358.173" cy="685.197" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="358.173" cy="685.197" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="358.173" y1="75.068" x2="358.173" y2="95.068" style="stroke:#52687A;stroke-width:1;"/><polygon points="354.173,85.068,358.173,95.068,362.173,85.068,358.173,89.068" fill="#52687A" style="stroke:#52687A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="358.173" y1="164.1" x2="358.173" y2="184.1" style="stroke:#52687A;stroke-width:1;"/><polygon points="354.173,174.1,358.173,184.1,362.173,174.1,358.173,178.1" fill="#52687A" style="stroke:#52687A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="280.269" y1="252.444" x2="225.609" y2="252.444" style="stroke:#52687A;stroke-width:1;"/><line x1="225.609" y1="252.444" x2="225.609" y2="274.444" style="stroke:#52687A;stroke-width:1;"/><polygon points="221.609,264.444,225.609,274.444,229.609,264.444,225.609,268.444" fill="#52687A" style="stroke:#52687A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="436.078" y1="252.444" x2="490.737" y2="252.444" style="stroke:#52687A;stroke-width:1;"/><line x1="490.737" y1="252.444" x2="490.737" y2="274.444" style="stroke:#52687A;stroke-width:1;"/><polygon points="486.737,264.444,490.737,274.444,494.737,264.444,490.737,268.444" fill="#52687A" style="stroke:#52687A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="225.609" y1="310.788" x2="225.609" y2="361.477" style="stroke:#52687A;stroke-width:1;"/><line x1="225.609" y1="361.477" x2="346.173" y2="361.477" style="stroke:#52687A;stroke-width:1;"/><polygon points="336.173,357.477,346.173,361.477,336.173,365.477,340.173,361.477" fill="#52687A" style="stroke:#52687A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="490.737" y1="343.477" x2="490.737" y2="361.477" style="stroke:#52687A;stroke-width:1;"/><line x1="490.737" y1="36