<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:413px;height:1184px;background:#FFFFFF;" width="413px" height="1184px" viewBox="0 0 413 1184" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="12"><text x="67.959" y="34.966" fill="#000" font-size="14" textLength="275.169" font-weight="700" font-family="'Noto Sans'">render(): the order of one pass and why</text></g><ellipse cx="204.543" cy="65.068" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="65.938" y="95.068" width="277.21" height="52.688" fill="#EDEDED" style="stroke:#52687A;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="75.938" y="117.896" fill="#182734" font-size="12" textLength="217.706" font-family="'Noto Sans'">Set the fitter's scale from the viewport,</text><text x="75.938" y="134.24" fill="#182734" font-size="12" textLength="257.21" font-family="'Noto Sans'">because widths are quantized to device pixels</text><rect x="79.229" y="167.756" width="250.63" height="36.344" fill="#EDEDED" style="stroke:#52687A;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="89.229" y="190.584" fill="#182734" font-size="12" textLength="230.63" font-family="'Noto Sans'">Drop the status message if it has expired</text><rect x="18.394" y="224.1" width="372.299" height="85.376" fill="#E2EFDA" style="stroke:#52687A;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="28.394" y="246.928" fill="#182734" font-size="12" textLength="95.821" font-weight="700" font-family="'Noto Sans'">render_visibility</text><text x="28.394" y="263.272" fill="#182734" font-size="12" textLength="308.654" font-family="'Noto Sans'">Show or hide the sidebar. Hide the panel for the Wallet</text><text x="28.394" y="279.617" fill="#182734" font-size="12" textLength="34.272" font-style="italic" font-family="'Noto Sans'">before</text><text x="65.786" y="279.617" fill="#182734" font-size="12" textLength="314.906" font-family="'Noto Sans'">any panel HTML is set, so no gap opens above the form.</text><text x="28.394" y="295.961" fill="#182734" font-size="12" textLength="305.378" font-family="'Noto Sans'">Show the wallet form and the find box (.off) as needed</text><rect x="16" y="329.477" width="377.087" height="52.688" fill="#DDEBF7" style="stroke:#52687A;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="352.305" fill="#182734" font-size="12" textLength="125.017" font-weight="700" font-family="'Noto Sans'">render_toolbar_state</text><text x="26" y="368.649" fill="#182734" font-size="12" textLength="357.087" font-family="'Noto Sans'">Rail .on, the sidebar toggle pressed, Back and Forward disabled</text><rect x="31.948" y="402.165" width="345.19" height="69.032" fill="#DDEBF7" style="stroke:#52687A;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="41.948" y="424.993" fill="#182734" font-size="12" textLength="92.305" font-weight="700" font-family="'Noto Sans'">render_address</text><text x="41.948" y="441.337" fill="#182734" font-size="12" textLength="287.126" font-family="'Noto Sans'">Restore the page address unless the user is typing.</text><text x="41.948" y="457.681" fill="#182734" font-size="12" textLength="325.19" font-family="'Noto Sans'">The focus ring, and the ghost hints from the raw field text</text><rect x="89.201" y="550.058" width="230.686" height="36.344" fill="#FFF2CC" style="stroke:#52687A;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="99.201" y="572.886" fill="#182734" font-size="12" textLength="210.686" font-family="'Noto Sans'">select its whole text, caret at the start</text><polygon points="63.998,491.197,345.088,491.197,357.088,507.541,345.088,523.886,63.998,523.886,51.998,507.541,63.998,491.197" fill="#DDEBF7" style="stroke:#52687A;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="208.543" y="536.714" fill="#000" font-size="12" textLength="18.636" font-family="'Noto Sans'">yes</text><text x="63.998" y="504.025" fill="#182734" font-size="12" textLength="281.09" font-family="'Noto Sans'">a field asked to be selected by Ctrl+L, Esc or Ctrl+F</text><text x="63.998" y="520.369" fill="#182734" font-size="12" textLength="137.857" font-family="'Noto Sans'">and it still has the focus?</text><polygon points="204.543,606.402,216.543,618.402,204.543,630.402,192.543,618.402,204.543,606.402" fill="#DDEBF7" style="stroke:#52687A;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="102.869" y="650.402" width="203.349" height="52.688" fill="#DDEBF7" style="stroke:#52687A;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="112.869" y="673.23" fill="#182734" font-size="12" textLength="98.053" font-weight="700" font-family="'Noto Sans'">render_tab_strip</text><text x="112.869" y="689.574" fill="#182734" font-size="12" textLength="183.349" font-family="'Noto Sans'">strip_layout, then the fitted titles</text><rect x="48.13" y="723.09" width="312.826" height="52.688" fill="#DDEBF7" style="stroke:#52687A;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="58.13" y="745.918" fill="#182734" font-size="12" textLength="117.673" font-weight="700" font-family="'Noto Sans'">render_suggestions</text><text x="58.13" y="762.262" fill="#182734" font-size="12" textLength="292.826" font-family="'Noto Sans'">The badge, identity or magnifier, and the dropdown</text><rect x="73.63" y="795.778" width="261.826" height="52.688" fill="#FCE4D6" style="stroke:#52687A;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="83.63" y="818.606" fill="#182734" font-size="12" textLength="90.313" font-weight="700" font-family="'Noto Sans'">render_prompt</text><text x="83.63" y="834.95" fill="#182734" font-size="12" textLength="241.826" font-family="'Noto Sans'">The active tab's first question, with "1 of N"</text><rect x="44.128" y="868.466" width="320.83" height="52.688" fill="#E2EFDA" style="stroke:#52687A;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="54.128" y="891.294" fill="#182734" font-size="12" textLength="89.869" font-weight="700" font-family="'Noto Sans'">render_sidebar</text><text x="54.128" y="907.639" fill="#182734" font-size="12" textLength="300.83" font-family="'Noto Sans'">Header and count, constant controls, chips, the panel</text><rect x="51.736" y="941.155" width="305.614" height="52.688" fill="#FFF2CC" style="stroke:#52687A;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="61.736" y="963.983" fill="#182734" font-size="12" textLength="68.988" font-weight="700" font-family="'Noto Sans'">render_find</text><text x="61.736" y="980.327" fill="#182734" font-size="12" textLength="285.614" font-family="'Noto Sans'">The box's count and ghost hint, and the hit overlay</text><rect x="64.258" y="1013.843" width="280.57" height="52.688" fill="#EDEDED" style="stroke:#52687A;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="74.258" y="1036.671" fill="#182734" font-size="12" textLength="82.825" font-weight="700" font-family="'Noto Sans'">render_status</text><text x="74.258" y="1053.015" fill="#182734" font-size="12" textLength="260.57" font-family="'Noto Sans'">Stage chip, reason or notice, budget, message</text><rect x="59.452" y="1086.531" width="290.182" height="36.344" fill="#EDEDED" style="stroke:#52687A;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="69.452" y="1109.359" fill="#182734" font-size="12" textLength="270.182" font-family="'Noto Sans'">Window title: the page title, then " — F1R3Gaze"</text><ellipse cx="204.543" cy="1153.875" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="204.543" cy="1153.875" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="204.543" y1="75.068" x2="204.543" y2="95.068" style="stroke:#52687A;stroke-width:1;"/><polygon points="200.543,85.068,204.543,95.068,208.543,85.068,204.543,89.068" fill="#52687A" style="stroke:#52687A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="204.543" y1="