<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:883px;height:407px;background:#FFFFFF;" width="883px" height="407px" viewBox="0 0 883 407" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="12"><text x="276.145" y="24.966" fill="#000" font-size="14" textLength="324.001" font-weight="700" font-family="'Noto Sans'">Pointer hover across the chrome and its pages</text></g><g class="entity" data-qualified-name="OverChrome" id="ent0001" data-source-line="14"><rect x="254.09" y="324.828" width="320.398" height="69.032" fill="#DDEBF7" style="stroke:#52687A;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="254.09" y1="351.172" x2="574.488" y2="351.172" style="stroke:#52687A;stroke-width:0.5;"/><text x="366.625" y="342.656" fill="#182734" font-size="12" textLength="95.329" font-family="'Noto Sans'">Over the chrome</text><text x="259.09" y="369" fill="#182734" font-size="12" textLength="90.313" font-family="'Noto Sans'">hovered = None</text><text x="259.09" y="385.344" fill="#182734" font-size="12" textLength="300.398" font-family="'Noto Sans'">cursor: that of the chrome element under the pointer</text></g><g class="entity" data-qualified-name="OverPage" id="ent0002" data-source-line="18"><rect x="89.18" y="47.068" width="344.206" height="150.753" fill="#E4DFEC" style="stroke:#52687A;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="89.18" y1="73.412" x2="433.386" y2="73.412" style="stroke:#52687A;stroke-width:0.5;"/><text x="226.807" y="64.896" fill="#182734" font-size="12" textLength="68.952" font-family="'Noto Sans'">Over page P</text><text x="94.18" y="91.24" fill="#182734" font-size="12" textLength="103.333" font-family="'Noto Sans'">hovered = P's host</text><text x="94.18" y="107.584" fill="#182734" font-size="12" textLength="251.09" font-family="'Noto Sans'">cursor: that of P's element under the pointer</text><text x="94.18" y="123.928" fill="#182734" font-size="12" textLength="109.525" font-weight="700" font-family="'Noto Sans'">Without leaving P:</text><text x="94.18" y="140.272" fill="#182734" font-size="12" textLength="254.33" font-family="'Noto Sans'">· the pointer moves in P, or P is laid out again</text><text x="94.18" y="156.617" fill="#182734" font-size="12" textLength="321.278" font-family="'Noto Sans'">(refresh_hover): P reports dirty, the cursor is recomputed</text><text x="94.18" y="172.961" fill="#182734" font-size="12" textLength="324.206" font-family="'Noto Sans'">· a new document replaces P (page_attached): it is seeded</text><text x="94.18" y="189.305" fill="#182734" font-size="12" textLength="311.462" font-family="'Noto Sans'">· the hover moves onto another page Q: clear P, seed Q</text></g><g class="start_entity" data-qualified-name=".start." id="ent0003" data-source-line="27"><ellipse cx="859.29" cy="122.448" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN8" id="ent0009" data-source-line="33"><path d="M468.27,76.588 L468.27,118.448 L433.84,122.448 L468.27,126.448 L468.27,168.308 A0,0 0 0 0 468.27,168.308 L814.304,168.308 A0,0 0 0 0 814.304,168.308 L814.304,86.588 L804.304,76.588 L468.27,76.588 A0,0 0 0 0 468.27,76.588" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M804.304,76.588 L804.304,86.588 L814.304,86.588 L804.304,76.588" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="474.27" y="94.416" fill="#000" font-size="12" textLength="173.053" font-family="'Noto Sans'">Every sync ends the same way:</text><text x="474.27" y="110.76" fill="#000" font-size="12" textLength="299.366" font-family="'Noto Sans'">cursor = window_cursor(get_cursor(), hidden_by_css),</text><text x="474.27" y="127.104" fill="#000" font-size="12" textLength="254.354" font-family="'Noto Sans'">and the window is told only when it changed.</text><text x="474.27" y="143.448" fill="#000" font-size="12" textLength="259.838" font-family="'Noto Sans'">Seeding and clearing change hover state only:</text><text x="474.27" y="159.792" fill="#000" font-size="12" textLength="325.034" font-family="'Noto Sans'">no DOM event is dispatched, as with Blitz's refresh_hover.</text></g><!--link *start* to OverChrome--><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" id="lnk4" data-source-line="27" data-link-type="dependency"><path d="M860.07,132.608 C862,161.388 863.68,250.788 815.29,294.828 C780.1,326.848 675.483,342.347 579.753,350.237" style="stroke:#52687A;stroke-width:1;" fill="none" id="*start*-to-OverChrome"/><polygon points="574.77,350.648,584.068,353.895,579.753,350.237,583.411,345.922,574.77,350.648" fill="#52687A" style="stroke:#52687A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link OverChrome to OverPage--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="28" data-link-type="dependency"><path d="M498.29,324.438 C509.47,316.378 519.42,306.608 526.29,294.828 C541.27,269.098 543.04,252.438 526.29,227.828 C526.23,227.748 488.802,212.99 438.192,193.06" style="stroke:#52687A;stroke-width:1;" fill="none" id="OverChrome-to-OverPage"/><polygon points="433.54,191.228,440.448,198.247,438.192,193.06,443.38,190.804,433.54,191.228" fill="#52687A" style="stroke:#52687A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="560.074" y="241.656" fill="#000" font-size="12" textLength="225.386" font-family="'Noto Sans'">the chrome's hover moves onto P's host</text><text x="571.042" y="258" fill="#000" font-size="12" textLength="203.449" font-family="'Noto Sans'">(a pointer event, or a layout change:</text><text x="598.426" y="274.344" fill="#000" font-size="12" textLength="148.681" font-family="'Noto Sans'">tab switch, sidebar toggle)</text><text x="539.2" y="290.688" fill="#000" font-size="12" textLength="38.508" font-weight="700" font-family="'Noto Sans'">seed P</text><text x="577.708" y="290.688" fill="#000" font-size="12" textLength="228.626" font-family="'Noto Sans'">: set_hover_to(pointer in P's coordinates)</text></g><!--link OverPage to OverChrome--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" id="lnk6" data-source-line="29" data-link-type="dependency"><path d="M88.86,170.808 C63.68,185.118 40.99,203.708 25.29,227.828 C9.04,252.778 6,272.138 25.29,294.828 C54.98,329.758 155.184,345.15 248.694,352.24" style="stroke:#52687A;stroke-width:1;" fill="none" id="OverPage-to-OverChrome"/><polygon points="253.68,352.618,245.008,347.949,248.694,352.24,244.403,355.926,253.68,352.618" fill="#52687A" style="stroke:#52687A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="26.29" y="249.656" fill="#000" font-size="12" textLength="194.113" font-family="'Noto Sans'">the chrome's hover leaves P's host</text><text x="29.35" y="266" fill="#000" font-size="12" textLength="40.056" font-weight="700" font-family="'Noto Sans'">clear P</text><text x="69.406" y="266" fill="#000" font-size="12" textLength="147.937" font-family="'Noto Sans'">: clear_hover() ends :hover</text><text x="34.804" y="282.344" fill="#000" font-size="12" textLength="177.085" font-family="'Noto Sans'">and forgets P's pointer position</text></g><!--link OverPage to OverChrome--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" id="lnk7" data-source-line="30" data-link-type="dependency"><path d="M241.34,198.028 C237.06,230.278 238.49,266.938 257.29,294.828 C265.34,306.768 271.872,313.736 283.952,321.616" style="stroke:#52687A;stroke-width:1;" fill="none" id="OverPage-to-OverChrome-1"/><polygon points="288.14,324.348,282.787,316.081,283.952,321.616,278.417,322.781,288.14,324.348" fill="#52687A" style="stroke:#52687A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="299.336" y="258.156" fill="#000" font-size="12" textLength="177.013" font-family="'Noto Sans'">P's host is removed (tab closed)</text><text x="258.29" y="274.5" fill="#000" font-size="12" textLength="49.38" font-weight="700" font-family="'Noto Sans'">forget it</text><text x="307.67" y="274.5" fill="#000" font-size="12" textLength="209.726" font-family="'Noto Sans'">: view_removed (node ids are reused)</text></g><?plantuml-src VLN1Rjim3BtxAuZqK6T8Cwphri9e2xHDUblheWDsM8PKiHXRc2CPafmW7VPTk-_BHbfEwcJTRZ4baO_lFJA7yBb047QcFDf31nOpOoMOENYALo97A8ppK6k9DiICqdGNugV2BD6YVEeFG6WP7SAg41vGP0LuAxHJNXaDqg03RxRvt11kJ6bgwnAObJN2nKvQvO3JKZQEPeKr2nn0LTkgvAjy1g99D8pSTwKhOSK29Cv5NVfRe_sTM23qxWoLV2GGlTTlFQfdX7V7dKDN26bMIkSm5wN3xeaN7k57171DtA1b-1OEFXn_F3kzekYLjMQr7-GYRUpTsV7f-vFeP-ILfoRIjjCYz99PurodMUOIb7U1h2WArNltovR_SAi7mW77RiAZWz5eV7rx6dL22RG24MrtHkFkMKO269jGIjAibRi5W2KkKB-Y-IwOnXpf5aZAdmVZaz7j-2RQ1heWKl8NcwbxkW-3x_oxVkVX-UpoY_A5gJsKA9QiMvgSlvrTTY_z_hNZhGL1SQ0qf0CWOL8sMoaKsPsoY5metNqSMvnRTCMqwQ2Vq7sBbR4aZLJMhmU1iwO1piIZiwXgZt8FWW2DAvg3h6xQeYIbo0X82Z5pE1NUqyoWf1BASoQ7AF_AmiM2PK8Rv2z3NZ4KRxLu83g92yljSGfuYAAlRxx1qT5bnofT6snEsYel7cYKsgkraM-YOx6b59VKKiEc82hNJ6HM29rZCj5UpC2jbCyAmgCapWYQDtbUOd-YIRy6OygQ9OJN1vwdtiJRNQ2RefcXiLEQdEVwBwJiTlKwUdO64xr5JbLRYaBPvYCKZlk0MZf8cg-9vZ6S6vkZ3mase2eJ5jj_a6pg1LSmXH9YPYChZIET6nmXDoaUa2mLhgRRozf814LeX4LAKVEhA2AnwKlbHJCgc_gqRCRqSmrkhRFG0rFXU0-kn3gXyzQa5q3xZPRSD7p7L7_patPueQH4FPsjfvbp_G4zOmeuLNZ5tNXJqhJeSasx7ZNRDQWjXtJzaVJaEUHd3R7y4SvRFSBwuFUCIXiOtNyA5kBaKhbAU9w40IyLSau1rwNopyt_KcSMXn5r2Sp67m00?></g></svg>