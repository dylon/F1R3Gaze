Sans'">address suggestions</text><text x="235.071" y="198.926" fill="#182734" font-size="12" textLength="70.92" font-style="italic" font-family="'Noto Sans'">#suggestions</text><text x="43.67" y="215.27" fill="#182734" font-size="12" textLength="267.854" font-family="'Noto Sans'">absolute under #urlwrap; empty → display:none</text></g><!--entity find--><g class="entity" data-qualified-name="find" id="ent0003" data-source-line="17"><rect x="27.4" y="288.788" width="300.394" height="52.688" fill="#FFF2CC" style="stroke:#52687A;stroke-width:0.5;" rx="3" ry="3"/><text x="37.4" y="311.616" fill="#182734" font-size="12" textLength="52.812" font-weight="700" font-family="'Noto Sans'">z-index 6</text><text x="99.572" y="311.616" fill="#182734" font-size="12" textLength="92.689" font-family="'Noto Sans'">floating find box</text><text x="198.501" y="311.616" fill="#182734" font-size="12" textLength="47.1" font-style="italic" font-family="'Noto Sans'">#findbar</text><text x="37.4" y="327.96" fill="#182734" font-size="12" textLength="280.394" font-family="'Noto Sans'">absolute, top-right of #main; hidden with visibility</text></g><!--entity overlay--><g class="entity" data-qualified-name="overlay" id="ent0004" data-source-line="18"><rect x="25.76" y="401.478" width="303.682" height="52.688" fill="#FFF9E5" style="stroke:#52687A;stroke-width:0.5;" rx="3" ry="3"/><text x="35.76" y="424.306" fill="#182734" font-size="12" textLength="52.812" font-weight="700" font-family="'Noto Sans'">z-index 2</text><text x="97.932" y="424.306" fill="#182734" font-size="12" textLength="81.517" font-family="'Noto Sans'">find highlights</text><text x="185.689" y="424.306" fill="#182734" font-size="12" textLength="108.229" font-style="italic" font-family="'Noto Sans'">#findoverlay .findhit</text><text x="35.76" y="440.65" fill="#182734" font-size="12" textLength="283.682" font-family="'Noto Sans'">absolute, inset 0 over #main; pointer-events: none</text></g><!--entity chrome--><g class="entity" data-qualified-name="chrome" id="ent0005" data-source-line="19"><rect x="7" y="525.508" width="341.194" height="52.688" fill="#E2EFDA" style="stroke:#52687A;stroke-width:0.5;" rx="3" ry="3"/><text x="17" y="548.336" fill="#182734" font-size="12" textLength="73.645" font-weight="700" font-family="'Noto Sans'">z-index auto</text><text x="100.005" y="548.336" fill="#182734" font-size="12" textLength="188.749" font-family="'Noto Sans'">chrome boxes in document order</text><text x="17" y="564.68" fill="#182734" font-size="12" textLength="321.194" font-family="'Noto Sans'">rows, row actions (absolute, z auto), cards, menus, status</text></g><!--entity pages--><g class="entity" data-qualified-name="pages" id="ent0006" data-source-line="20"><rect x="23.06" y="649.538" width="309.082" height="52.688" fill="#DDEBF7" style="stroke:#52687A;stroke-width:0.5;" rx="3" ry="3"/><text x="33.06" y="672.366" fill="#182734" font-size="12" textLength="124.861" font-weight="700" font-family="'Noto Sans'">page sub-documents</text><text x="167.281" y="672.366" fill="#182734" font-size="12" textLength="149.425" font-family="'Noto Sans'">one RhoDocument per tab</text><text x="33.06" y="688.71" fill="#182734" font-size="12" textLength="289.082" font-family="'Noto Sans'">painted as part of #main, below every hoisted layer</text></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="29"><path d="M383.13,514.168 L383.13,547.848 L348.61,551.848 L383.13,555.848 L383.13,589.544 A0,0 0 0 0 383.13,589.544 L768.057,589.544 A0,0 0 0 0 768.057,589.544 L768.057,524.168 L758.057,514.168 L383.13,514.168 A0,0 0 0 0 383.13,514.168" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M758.057,514.168 L758.057,524.168 L768.057,524.168 L758.057,514.168" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="389.13" y="531.996" fill="#000" font-size="12" textLength="47.64" font-weight="700" font-family="'Noto Sans'">Rule R2.</text><text x="439.89" y="531.996" fill="#000" font-size="12" textLength="298.226" font-family="'Noto Sans'">Persistent boxes inside #panel and #tabs never get a</text><text x="389.13" y="548.34" fill="#000" font-size="12" textLength="363.927" font-family="'Noto Sans'">z-index: a hoisted box ignores clips from its ancestors and would</text><text x="389.13" y="564.684" fill="#000" font-size="12" textLength="255.23" font-family="'Noto Sans'">paint over the toolbar when the panel scrolls.</text><text x="389.13" y="581.028" fill="#000" font-size="12" textLength="314.39" font-family="'Noto Sans'">Ancestors of overlays get no opacity, transform or filter.</text></g><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="35"><path d="M337.54,52.068 L337.54,77.578 L302.56,81.578 L337.54,85.578 L337.54,111.1 A0,0 0 0 0 337.54,111.1 L577.662,111.1 A0,0 0 0 0 577.662,111.1 L577.662,62.068 L567.662,52.068 L337.54,52.068 A0,0 0 0 0 337.54,52.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M567.662,52.068 L567.662,62.068 L577.662,62.068 L567.662,52.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="343.54" y="69.896" fill="#000" font-size="12" textLength="213.302" font-family="'Noto Sans'">Hoisted layers are also hit-tested first,</text><text x="343.54" y="86.24" fill="#000" font-size="12" textLength="219.122" font-family="'Noto Sans'">so the dropdown and the find box take</text><text x="343.54" y="102.584" fill="#000" font-size="12" textLength="196.393" font-family="'Noto Sans'">clicks before the page under them.</text></g><!--link tips to sugg--><!--link sugg to find--><!--link find to overlay--><!--link overlay to chrome--><!--link chrome to pages--><?plantuml-src TPNDRjiu58NtUeeBQv44iDpMJPEE6nX8OXkp60H5kfmC1fH4MqHeNe6aujf5j_C0yuXzaXvIaftnr07iMEJLqSTpVtH6duKodjYMqWx9SuqFvUmzhqTqfvNVKSNAUKV2aDHoBKDqWy-I55PhOR5ovf8p_Dmh4HkzfKqb3O988OoTyegDBEdsOKQLW1uPDjbEMgPTfamflqBZF0-Fp5gf-FstjrAEhBiOqVn5sgslb5c1nCbstv4oL7BHj6Jn710IfYHVXPYL9DVaMH_YEiwDyXMbQ_mU9UvP6Hn4hAcKIz