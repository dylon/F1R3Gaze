\* Windows: the deep run under NTFS semantics (W1, W2): no directory
\* syncs, a prefix of each volume's operations survives a power cut, and
\* naming or syncing a file commits its volume. ReadyIsDurable concerns the
\* start barrier, which does nothing there, so it is not checked.
CONSTANTS
    u = u
    k = k
    s = s
    v = v
    m = m
    Order <- MC_Order
    Converted <- MC_Converted
    CrossDev <- MC_CrossDev
    Checked <- MC_Checked
    MaxCrashes = 2
    PowerLoss = TRUE
    Ntfs = TRUE
    Fault = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoLoss
    NoOverwrite
    CorruptKept
    ValidUntouched
    PublishedComplete
    MarkerImpliesComplete
    ReadyIsValid
PROPERTIES
    Termination
